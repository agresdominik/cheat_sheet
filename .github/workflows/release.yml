# .github/workflows/release.yml
#
# Called by ci.yml when VERSION changes on main.
# Can also be triggered manually via workflow_dispatch for hotfixes.
#
# The Homebrew tap (agresdominik/repo) is not touched here: Renovate picks up the new tag
# and opens a PR there that bumps the formula's url + sha256.

name: Release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (without v prefix, e.g. 1.2.0)'
        required: true
        type: string

jobs:
  release:
    name: Tag, Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version matches VERSION file
        run: |
          FILE_VERSION=$(cat VERSION)
          INPUT_VERSION="${{ inputs.version }}"
          if [ "$FILE_VERSION" != "$INPUT_VERSION" ]; then
            echo "ERROR: VERSION file ($FILE_VERSION) does not match input ($INPUT_VERSION)"
            exit 1
          fi

      - name: Check tag availability
        run: |
          TAG="v${{ inputs.version }}"
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; then
            echo "ERROR: Tag $TAG already exists."
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make build

      - name: Create git tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ inputs.version }}" -m "Release v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          generate_release_notes: true
          files: bin/cheatsh

